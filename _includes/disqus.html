<section class="comments">
  <h2 class="comments__title">Comments</h2>
  <div id="disqus_thread"></div>
  <noscript>Enable JavaScript to read the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus</a>.</noscript>
</section>

<script>
  (function () {
    var loaded = false;
    function load() {
      if (loaded) return;
      loaded = true;
      window.disqus_shortname = '{{ site.disqus }}';
      var s = document.createElement('script');
      s.src = 'https://{{ site.disqus }}.disqus.com/embed.js';
      s.setAttribute('data-timestamp', +new Date());
      document.head.appendChild(s);
    }
    var target = document.getElementById('disqus_thread');
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) { load(); io.disconnect(); }
      }, { rootMargin: '400px' });
      io.observe(target);
    } else { load(); }
  })();
</script>
