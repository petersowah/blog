<header class="masthead">
  <div class="shell masthead__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      {% include glyph.html name="adinkrahene" class="brand__mark glyph--round" label="Adinkrahene" %}
      <span class="brand__name">{{ site.title }}</span>
    </a>

    <nav class="nav" aria-label="Main">
      <ul class="nav__list" id="nav-list">
        {%- for item in site.navigation %}
        <li>
          <a class="nav__link" href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.text }}</a>
        </li>
        {%- endfor %}
      </ul>

      <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Switch colour theme">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4M5.1 5.1l1.7 1.7M17.2 17.2l1.7 1.7M18.9 5.1l-1.7 1.7M6.8 17.2l-1.7 1.7"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7Z"/></svg>
      </button>

      <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-list" aria-label="Open menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </nav>
  </div>
</header>
