<footer class="site-footer">
  <div class="shell">
    <div class="site-footer__inner">
      <div>
        <p class="footer-sign"><a href="{{ '/' | relative_url }}">Let’s build<br>something.</a></p>
        <p class="footer-note">{{ site.data.author.short_bio }} Open to a good conversation about APIs, platform work or Laravel.</p>
      </div>
      <div>
        <h2 class="footer-col__head">Find me</h2>
        {% include social.html %}
      </div>
    </div>
    <div class="footer-bar">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.data.author.name }} — {{ site.data.author.location }}</p>
      <p><a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
    </div>
  </div>
</footer>
