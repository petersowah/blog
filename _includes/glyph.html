{%- comment -%}
  Adinkra glyphs, drawn as geometry. Each one is chosen for what it means,
  not for decoration: the meaning is printed alongside it wherever it marks a section.
{%- endcomment -%}
<svg class="glyph {{ include.class }}" viewBox="0 0 100 100" role="img"
     aria-label="{{ include.label | default: 'Adinkra symbol' }}" focusable="false">
{%- case include.name -%}
{%- when 'adinkrahene' -%}
  <circle cx="50" cy="50" r="42" style="--len:270"/>
  <circle cx="50" cy="50" r="27" style="--len:175"/>
  <circle cx="50" cy="50" r="12" style="--len:80"/>
{%- when 'nkyinkyim' -%}
  <path d="M6 92 V58 H28 V16 H50 V58 H72 V16 H94 V50" style="--len:300"/>
{%- when 'nkyimu' -%}
  <rect x="10" y="10" width="80" height="80" style="--len:330"/>
  <path d="M10 10 L90 90" style="--len:115"/>
  <path d="M90 10 L10 90" style="--len:115"/>
  <path d="M50 10 V90 M10 50 H90" style="--len:170"/>
{%- when 'sankofa' -%}
  <path d="M50 92 C16 66 8 52 8 36 A17 17 0 0 1 42 36 A9 9 0 0 0 24 36" style="--len:190"/>
  <path d="M50 92 C84 66 92 52 92 36 A17 17 0 0 0 58 36 A9 9 0 0 1 76 36" style="--len:190"/>
{%- when 'fihankra' -%}
  <path d="M40 12 H12 V88 H88 V12 H60 V40 H40 Z" style="--len:340"/>
{%- when 'nkonsonkonson' -%}
  <ellipse cx="35" cy="50" rx="27" ry="18" style="--len:290"/>
  <ellipse cx="65" cy="50" rx="27" ry="18" style="--len:290"/>
{%- when 'mmusuyidee' -%}
  <path d="M50 8 L64 36 L92 50 L64 64 L50 92 L36 64 L8 50 L36 36 Z" style="--len:330"/>
{%- endcase -%}
</svg>
