# Site
lang: en-GH
title: "Peter Sowah"
tagline: "CTO at Mizormor, Accra"
description: "Peter Sowah is CTO at Mizormor in Accra, Ghana. He writes about PHP, Laravel, Ruby, JavaScript, API design and the systems underneath them."
url: "https://petersowah.dev"
baseurl: ""

# Navigation
navigation:
- text: Writing
  url: /
- text: About
  url: /about/
- text: Archive
  url: /archive/

# Comments
disqus: petersowah-dev

# Analytics — set to your GA4 measurement id to enable
google_analytics: "UA-87473467-1"

# Build
highlighter: rouge
markdown: kramdown
permalink: /:title
paginate: 8
paginate_path: '/page:num/'

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-paginate
  - jekyll-sitemap

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE.md
  - stackbit.yaml
  - .idea
